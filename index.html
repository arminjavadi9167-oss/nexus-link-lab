<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Link Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      padding: 20px;
    }

    .page-title {
      text-align: center;
      font-size: 27px;
      margin: 20px 0 35px;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #1d293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0006;
    }

    .description {
      text-align: center;
      color: #b8c4d6;
      font-size: 14px;
      line-height: 2;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #40516b;
      border-radius: 8px;
      background: #111c2d;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3978f6;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #3978f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2864d8;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #263c36;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .notice {
      color: #8fa3bd;
      font-size: 11px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1 class="page-title">Instagram Link Lab</h1>

  <main class="container">

    <p class="description">
      این یک صفحه آزمایشی و آموزشی از پروژه Nexus Link Lab است.
    </p>

    <form id="testForm">

      <label for="demoName">نام مستعار آزمایشی</label>
      <input
        id="demoName"
        type="text"
        maxlength="30"
        placeholder="مثلاً TestUser"
        required
      >

      <label for="demoCode">شناسه ساختگی آزمایش</label>
      <input
        id="demoCode"
        type="text"
        maxlength="20"
        placeholder="مثلاً TEST-1234"
        required
      >

      <button type="submit">اجرای آزمایش</button>

    </form>

    <div id="result" aria-live="polite"></div>

    <p class="notice">
      این پروژه مستقل است و وابستگی رسمی به Instagram ندارد.
    </p>

  </main>

  <script>
    const form = document.getElementById("testForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("demoName").value.trim();
      const code = document.getElementById("demoCode").value.trim();

      if (!name || !code) {
        return;
      }

      const testId = "NXL-" + crypto.randomUUID().slice(0, 8);

      result.style.display = "block";
      result.replaceChildren();

      const title = document.createElement("strong");
      title.textContent = "آزمایش با موفقیت انجام شد";

      const alias = document.createElement("p");
      alias.textContent = "نام مستعار: " + name;

      const demoId = document.createElement("p");
      demoId.textContent = "شناسه ساختگی: " + code;

      const generatedId = document.createElement("p");
      generatedId.textContent = "شناسه آزمایش: " + testId;

      result.append(title, alias, demoId, generatedId);
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>Nexus Link Lab | Educational Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #ffffff;
            background: linear-gradient(135deg, #101827, #182d49);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 25px;
            border: 1px solid #344967;
            border-radius: 18px;
            background: #1c2b40;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 27px;
        }

        .subtitle {
            color: #a9bdd5;
            font-size: 14px;
        }

        .notice {
            margin: 25px 0;
            padding: 15px;
            border-radius: 10px;
            background: #263c56;
            color: #d7e7fa;
            font-size: 13px;
            line-height: 1.8;
        }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
            color: #d7e7fa;
        }

        .consent input {
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #3285ed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            min-height: 24px;
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 25px;
            color: #8198b5;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">🔬</div>

        <h1>Nexus Link Lab</h1>

        <p class="subtitle">
            Educational Cybersecurity Testing Environment
        </p>

        <div class="notice">
            This project is a harmless educational simulation.
            It does not request or collect account credentials,
            passwords, or verification codes.
            Only test completion status is reported.
        </div>

        <form id="demoForm">

            <label class="consent">
                <input type="checkbox" id="consent" required>

                <span>
                    I understand this is an educational test
                    and voluntarily agree to participate.
                </span>
            </label>

            <button type="submit" id="runButton">
                Run Educational Demo
            </button>

        </form>

        <p id="result" aria-live="polite"></p>

        <div class="footer">
            Nexus Link Lab — Educational Project
        </div>

    </main>

    <script>
        const form = document.getElementById("demoForm");
        const consent = document.getElementById("consent");
        const button = document.getElementById("runButton");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            if (!consent.checked) {
                result.textContent = "Please confirm your consent.";
                return;
            }

            button.disabled = true;
            result.textContent = "Sending test notification...";

            try {

                const response = await fetch("/submit", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        consent: true
                    })
                });

                const data = await response.json();

                if (!response.ok || data.notification_sent !== true) {
                    throw new Error("Notification failed");
                }

                result.textContent =
                    "Educational demo completed successfully!";

            } catch (error) {

                result.textContent =
                    "Notification failed. Please try again.";

            } finally {

                button.disabled = false;

            }

        });
    </script>

</body>
</html>

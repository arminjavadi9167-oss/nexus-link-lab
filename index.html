<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Link Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      box-shadow: 0 3px 15px #ccc;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #2878e8;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #result { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Nexus Link Lab</h2>
    <p>Educational Testing Environment</p>
    <p><strong>Demo only — Do not enter real account details.</strong></p>

    <form id="demoForm">
      <input type="text" placeholder="Demo username" required>
      <input type="text" placeholder="Test code" required>
      <button type="submit">Run Demo</button>
    </form>

    <p id="result"></p>
  </div>

  <script>
    document.getElementById("demoForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("result").textContent =
        "Demo completed successfully!";
      this.reset();
    });
  </script>
</body>
</html>

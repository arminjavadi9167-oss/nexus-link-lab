<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Link Lab</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 25px 15px;
        min-height: 100vh;
        background: #10131c;
        color: white;
        font-family: Tahoma, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 430px;
        background: #1b2030;
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 10px 35px #0006;
    }

    h1 {
        text-align: center;
        font-size: 25px;
        margin-top: 0;
        color: #e6a8ff;
    }

    .intro {
        text-align: center;
        color: #c5c8d5;
        line-height: 1.9;
        font-size: 14px;
    }

    label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #424b65;
        border-radius: 9px;
        background: #111624;
        color: white;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #bd75ef;
    }

    .consent {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 20px;
        color: #d0d3df;
        font-size: 12px;
        line-height: 1.9;
    }

    .consent input {
        width: 17px;
        height: 17px;
        margin-top: 3px;
        flex-shrink: 0;
    }

    button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #a855d8;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #result {
        display: none;
        margin-top: 18px;
        padding: 13px;
        border-radius: 9px;
        background: #111624;
        line-height: 1.9;
        font-size: 13px;
        overflow-wrap: anywhere;
    }
</style>

</head><body>
    <main class="container">    <h1>Instagram Link Lab</h1>

    <p class="intro">
        این یک صفحه آزمایشی و آموزشی از پروژه Nexus Link Lab است.
    </p>

    <form id="testForm">

        <label for="demoName">نام مستعار آزمایشی</label>
        <input
            id="demoName"
            type="text"
            maxlength="30"
            pattern="[a-zA-Z0-9_-]{1,30}"
            placeholder="مثلاً armin"
            required
        >

        <label for="demoCode">شناسه ساختگی آزمایش</label>
        <input
            id="demoCode"
            type="text"
            maxlength="20"
            pattern="[a-zA-Z0-9]{1,20}"
            placeholder="مثلاً 1827dh"
            required
        >

        <label class="consent">
            <input type="checkbox" id="consent">
            <span>
                موافقم که نام مستعار و شناسه ساختگی واردشده
                به سرور ارسال و در داشبورد آموزشی نمایش داده شود.
            </span>
        </label>

        <button type="submit" id="submitButton">
            اجرای آزمایش
        </button>

    </form>

    <div id="result" role="status"></div>

</main>

<script>
    const API_URL =
        "https://nexus-link-api.onrender.com/submit";

    const form = document.getElementById("testForm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const demoName =
            document.getElementById("demoName").value.trim();

        const demoCode =
            document.getElementById("demoCode").value.trim();

        const consent =
            document.getElementById("consent").checked;

        result.style.display = "block";

        if (!consent) {
            result.textContent =
                "برای ارسال آزمایش، ابتدا باید رضایت خود را تأیید کنی.";
            return;
        }

        button.disabled = true;
        button.textContent = "در حال ارسال...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    consent: true,
                    demo_name: demoName,
                    demo_code: demoCode
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "ارسال آزمایش ناموفق بود."
                );
            }

            result.textContent =
                "آزمایش با موفقیت ثبت شد. شناسه ثبت: " +
                data.test_id;

            form.reset();

        } catch (error) {
            result.textContent =
                "خطا در ارتباط با سرور: " + error.message;
        } finally {
            button.disabled = false;
            button.textContent = "اجرای آزمایش";
        }
    });
</script>

</body>
</html>

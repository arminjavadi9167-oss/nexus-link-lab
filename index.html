<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Link Lab</title><style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background: white;
        width: 85%;
        max-width: 360px;
        padding: 30px;
        border: 1px solid #ddd;
        border-radius: 12px;
        text-align: center;
    }

    h1 {
        color: #262626;
        font-size: 27px;
    }

    p {
        color: #777;
        font-size: 14px;
    }

    input {
        width: 90%;
        padding: 13px;
        margin: 9px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    button {
        width: 98%;
        padding: 13px;
        margin-top: 15px;
        background: #3897f0;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
    }

    .notice {
        margin-top: 20px;
        font-size: 12px;
        color: #999;
    }
</style>

</head><body><div class="container"><h1>Instagram Link Lab</h1>

<p>Educational Testing Environment</p>

<form id="demoForm">

    <input
        type="text"
        placeholder="Gmail or Username"
        required
    >

    <input
        type="text"
        placeholder="Test Code"
        required
    >

    <button type="submit">Confirm</button>

</form>

<div class="notice">
    Demo only — Never enter real passwords.
</div>

</div><script>
document.getElementById("demoForm").addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Demo completed successfully!");
});
</script></body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Link Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #10172a, #253b63);
            font-family: Tahoma, Arial, sans-serif;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 20px;
            background: #ffffff12;
            border: 1px solid #ffffff25;
            box-shadow: 0 15px 45px #0005;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            line-height: 1.9;
            font-size: 13px;
        }

        .notice {
            background: #f59e0b20;
            border: 1px solid #f59e0b70;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.9;
            margin: 20px 0;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ffffff30;
            border-radius: 10px;
            background: #10172a;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 12px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .consent input {
            width: auto;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #082f49;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 22px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Nexus Link Lab</h1>

        <p class="subtitle">
            محیط شبیه‌سازی آموزشی و آزمایش آگاهی سایبری
        </p>

        <div class="notice">
            این صفحه متعلق به اینستاگرام نیست.
            فقط از نام مستعار و کد کاملاً ساختگی استفاده کنید.
            هیچ اطلاعاتی از فیلدهای زیر به سرور یا تلگرام ارسال نمی‌شود.
        </div>

        <form id="demoForm">

            <label for="demoName">
                نام مستعار آزمایشی
            </label>

            <input
                id="demoName"
                type="text"
                placeholder="مثلاً TestUser"
                autocomplete="off"
                required
            >

            <label for="demoCode">
                کد ساختگی آزمایش
            </label>

            <input
                id="demoCode"
                type="text"
                placeholder="مثلاً 123456"
                autocomplete="off"
                required
            >

            <label class="consent">
                <input id="consent" type="checkbox" required>
                <span>
                    می‌دانم این یک شبیه‌سازی آموزشی است و با ارسال
                    اعلان پایان آزمایش موافقم.
                </span>
            </label>

            <button id="submitButton" type="submit">
                ثبت پایان آزمایش
            </button>

        </form>

        <div id="result"></div>

        <footer>
            Nexus Link Lab — Educational Project
        </footer>
    </main>

    <script>
        const form = document.getElementById("demoForm");
        const result = document.getElementById("result");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!document.getElementById("consent").checked) {
                result.textContent = "ابتدا رضایت خود را تأیید کنید.";
                return;
            }

            button.disabled = true;
            result.textContent = "در حال ثبت پایان آزمایش...";

            try {
                const response = await fetch("/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        consent: true
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    result.textContent =
                        "آزمایش با موفقیت ثبت شد. اعلان ارسال شد.";
                    form.reset();
                } else {
                    result.textContent =
                        "ثبت آزمایش انجام نشد. تنظیمات سرور را بررسی کنید.";
                }

            } catch (error) {
                result.textContent =
                    "ارتباط با سرور برقرار نشد.";
            }

            button.disabled = false;
        });
    </script>
</body>
</html>
